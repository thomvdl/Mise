server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Résolveur Docker interne + `proxy_pass` sur une variable plutôt qu'un littéral : sans ça,
    # nginx résout `api` une seule fois au démarrage et garde l'IP en cache à vie — un
    # `docker compose up/restart api` tout seul (sans toucher public) change l'IP interne du
    # conteneur et casse le proxy en 502 Bad Gateway jusqu'au prochain restart de CE conteneur-ci.
    # Avec une variable, nginx re-résout à chaque requête (throttlé par `valid=10s`) — vécu en
    # prod (recréer `api` pour une variable d'env a cassé login dashboard/public jusqu'à restart).
    resolver 127.0.0.11 valid=10s;

    # Same-origin relative /api calls (environment.apiUrl = '/api') — proxied to the API
    # container so no CORS config is ever needed, on the dev proxy.conf.json's model.
    location /api/ {
        # `$request_uri` (pas de littéral après la variable) : avec un `proxy_pass` sur variable,
        # nginx n'applique PAS le remplacement de préfixe qu'il fait pour une cible littérale —
        # un littéral ici enverrait toujours exactement ce chemin-là à l'API, quelle que soit la
        # requête d'origine (vu en test : tout arrivait à l'API en `/api/` tout court).
        set $upstream_api http://api:80;
        proxy_pass $upstream_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Photos uploadées (stockage local de l'API, voir PictureController) — même proxy same-origin
    # que /api/ et pour la même raison : une Picture.url relative (/storage/...) ne charge
    # correctement que si CETTE origine (IP locale, tunnel...) sait aussi la servir.
    location /storage/ {
        set $upstream_api http://api:80;
        proxy_pass $upstream_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The service worker polls this on every navigation to decide whether a new version is
    # available — must never be cached, or the kitchen tablet could be stuck on a stale build.
    location = /ngsw.json {
        add_header Cache-Control "no-cache";
    }

    # Client-side routed Angular app — unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
