<div class="filter-bar">
  <nav class="stations">
    <button
      type="button"
      class="station-tab"
      [class.active]="activeStationSlug() === null"
      (click)="selectStation(null)">
      Toutes
    </button>
    @for (station of stations(); track station.id) {
      <button
        type="button"
        class="station-tab"
        [style.--card-color]="station.color"
        [class.active]="activeStationSlug() === station.slug"
        (click)="selectStation(station.slug)">
        {{ station.name }}
      </button>
    }
  </nav>
</div>
