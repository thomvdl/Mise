<div class="dt-picker">
  <button type="button" class="dt-trigger" (click)="toggle()" [disabled]="disabled()">
    <span [class.placeholder]="!displayLabel()">{{ displayLabel() || 'Choisir une échéance…' }}</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
  </button>

  @if (open()) {
    <div class="dt-panel">
      <div class="dt-panel-header">
        <button type="button" class="dt-nav" (click)="prevMonth()" aria-label="Mois précédent">‹</button>
        <span class="dt-month-label">{{ monthLabel() }}</span>
        <button type="button" class="dt-nav" (click)="nextMonth()" aria-label="Mois suivant">›</button>
      </div>

      <div class="dt-weekdays">
        @for (wd of weekdays; track $index) {
          <span>{{ wd }}</span>
        }
      </div>

      <div class="dt-days">
        @for (day of days(); track day.date.getTime()) {
          <button
            type="button"
            class="dt-day"
            [class.other-month]="!day.inMonth"
            [class.today]="day.isToday"
            [class.selected]="day.isSelected"
            (click)="selectDay(day)">
            {{ day.day }}
          </button>
        }
      </div>

      <div class="dt-time-row">
        <label class="dt-time-label">
          Heure
          <input type="time" class="dt-time-input" [value]="timeValue()" (change)="onTimeChange($event)" />
        </label>
        <div class="dt-actions">
          <button type="button" class="dt-link" (click)="clear()">Effacer</button>
          <button type="button" class="dt-ok" (click)="close()">OK</button>
        </div>
      </div>
    </div>
  }
</div>
