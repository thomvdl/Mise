
<a class="board-back-link" routerLink="/fiches">← Tableau par poste</a>

<app-recipe-filters
  [stations]="stations()"
  [(activeStationSlug)]="activeStationSlug"
  (searchChange)="searchQuery.set($event)">
</app-recipe-filters>

<button type="button" class="list-toggle-btn" (click)="toggleList()">
  {{ showList() ? 'Masquer la liste' : 'Voir la liste' }}
</button>

<div class="layout">
  @if (showList()) {
    <aside class="recipe-list">
      <app-recipe-list
        [fiches]="filteredFiches()"
        [selectedId]="selectedId()"
        (select)="selectedId.set($event)">
      </app-recipe-list>
    </aside>
  }
  <main class="detail">
    <app-recipe-detail [fiche]="selectedFiche()"></app-recipe-detail>
  </main>
</div>
