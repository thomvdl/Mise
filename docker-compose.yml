services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mise_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./mise-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Wiring fixed by this compose file — not meant to be edited in .env.
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stack
      FILESYSTEM_DISK: local
    volumes:
      - mise_api_storage:/var/www/html/storage/app/public
    ports:
      - "8000:80"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "8083:80"

  dashboard:
    build: ./mise-dashboard
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8081:80"

  public:
    build: ./mise-public
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8082:80"

volumes:
  mise_db_data:
  mise_api_storage:
