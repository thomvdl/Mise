# Déploiement de référence du projet — hébergement local (mini PC en cuisine ou tout poste avec
# Docker) + accès extérieur via tunnel Cloudflare (cloudflared-dashboard plus bas), voir DEPLOY.md
# pour la procédure complète. Limites mémoire et rotation des logs sur
# chaque service, pour qu'un conteneur qui dérape ne mette pas à genoux le reste ni ne remplisse
# le disque au fil des mois — pensées pour un mini PC, pas pour un gros serveur.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mise_db_data:/var/lib/mysql
    ports:
      # Publié pour que du code lancé nativement sur l'hôte (hors Docker, ex. artisan/tests)
      # puisse se connecter à la même base que le conteneur api (DB_HOST=127.0.0.1 dans .env),
      # avec les mêmes identifiants — plus besoin d'un MySQL local séparé.
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g
    logging: *default-logging

  # Sauvegarde automatique de la base (mysqldump quotidien, compressé, rotation sur les 14
  # derniers jours) — voir mise_db_backups ci-dessous pour où ils atterrissent. Conteneur maison
  # (./backup) plutôt qu'une image tierce comme fradelg/mysql-cron-backup : c'est juste un
  # mysqldump sur une boucle, pas besoin d'une dépendance externe pour ça.
  db-backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    volumes:
      - mise_db_backups:/backup
    mem_limit: 128m
    logging: *default-logging

  api:
    build: ./mise-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Seule différence réelle entre le conteneur et une exécution native : le nom d'hôte de
      # la base (réseau interne du compose vs 127.0.0.1). Tout le reste vient de .env, partagé
      # avec une exécution native de mise-api (voir mise-api/bootstrap/app.php).
      DB_HOST: db
    volumes:
      - mise_api_storage:/var/www/html/storage/app/public
    ports:
      - "8000:80"
    mem_limit: 512m
    logging: *default-logging

  # Broker MQTT local pour les capteurs de température Zigbee (voir §10 de DEPLOY.md). Port publié
  # comme pour "db" plus haut, pour du débogage ponctuel depuis l'hôte (mosquitto_sub) — zigbee2mqtt
  # et temperature-listener, eux, se connectent par le réseau interne du compose (mosquitto:1883).
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mise_mosquitto_data:/mosquitto/data
    ports:
      - "1883:1883"
    mem_limit: 64m
    logging: *default-logging

  # Pont Zigbee -> MQTT (capteurs de température, voir §10 de DEPLOY.md). Passthrough USB du
  # dongle vers le conteneur — marche aussi sous Docker Desktop/Windows (moteur WSL2), à condition
  # d'avoir attaché le périphérique à la distribution WSL "docker-desktop" au préalable avec
  # usbipd-win (voir DEPLOY.md §10.A) ; sous Linux, le device existe déjà nativement, rien de plus
  # à faire. ZIGBEE_SERIAL_DEVICE vient de .env (comme CLOUDFLARE_TUNNEL_ARGS plus haut), pas écrit
  # en dur ici : propre à chaque machine, et mise-app l'y écrit lui-même sous Windows (bouton
  # "Connecter", voir app/zigbee_windows.py) sans jamais toucher à ce fichier, qui reste suivi par
  # git. "configuration.yaml" n'est pas versionné non plus (même raison) — copier
  # configuration.yaml.example pour démarrer à la main, voir DEPLOY.md §10.A.
  #
  # Inutilisé sous macOS : Docker Desktop y est sans équivalent d'usbipd-win (aucun passthrough
  # USB possible, même indirect), donc Zigbee2MQTT y tourne nativement hors Docker à la place (voir
  # app/zigbee_macos.py) — ce service reste simplement arrêté sur cet OS.
  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:latest
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_started
    devices:
      - ${ZIGBEE_SERIAL_DEVICE:-/dev/null}:${ZIGBEE_SERIAL_DEVICE:-/dev/null}
    volumes:
      - ./zigbee2mqtt:/app/data
    environment:
      TZ: Europe/Brussels
    ports:
      # Interface web d'appairage (boutons "Permit join", renommage des capteurs) — 8084 côté hôte
      # pour ne pas entrer en conflit avec le port interne par défaut de l'image (8080).
      - "8084:8080"
    mem_limit: 256m
    logging: *default-logging

  # Écoute en continu les relevés publiés par Zigbee2MQTT (voir mosquitto ci-dessus et
  # App\Console\Commands\ListenTemperatureSensors) et les enregistre dans temperature_releves.
  # Entrypoint/commande volontairement réécrits ici (pas d'entrypoint.sh ni d'apache-foreground,
  # voir mise-api/docker/entrypoint.sh) : migrations/seed sont déjà gérées par le conteneur "api",
  # les lancer deux fois en parallèle au démarrage risquerait une collision.
  temperature-listener:
    build: ./mise-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    env_file: .env
    environment:
      DB_HOST: db
    entrypoint: ["/bin/sh", "-c"]
    # "$$" (pas "$") : sinon docker-compose interpole DB_HOST/DB_PORT lui-même au moment de lire ce
    # fichier (avec la valeur de l'hôte, 127.0.0.1) plutôt que de laisser le shell du conteneur les
    # lire à l'exécution (valeur réelle, "db" — voir "environment" ci-dessus).
    command:
      - >
        until php -r "new PDO('mysql:host=$$DB_HOST;port=$$DB_PORT', getenv('DB_USERNAME'), getenv('DB_PASSWORD'));" 2>/dev/null;
        do sleep 2; done;
        php artisan temperature:listen
    mem_limit: 128m
    logging: *default-logging

  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8083:8080"
    mem_limit: 128m
    logging: *default-logging

  dashboard:
    build: ./mise-dashboard
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8081:80"
    mem_limit: 128m
    logging: *default-logging

  public:
    build: ./mise-public
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8082:80"
    mem_limit: 128m
    logging: *default-logging

  # Tunnel Cloudflare "quick tunnel" pour le dashboard uniquement (pas pour public, laissé
  # purement local pour l'instant) : aucun compte/domaine Cloudflare requis, juste une URL
  # https://xxxx.trycloudflare.com générée à chaque démarrage (voir les logs du conteneur pour la
  # récupérer — elle change à chaque redémarrage, c'est la limite de ce mode). Accès extérieur
  # sans toucher au réseau local ni au routeur. Pas de port à publier : cloudflared rejoint le
  # réseau compose et atteint directement dashboard:80 par son nom de service.
  #
  # Pour une URL fixe (tunnel nommé, nécessite un domaine Cloudflare — voir DEPLOY.md §4), posez
  # CLOUDFLARE_TUNNEL_ARGS="run --token <token>" dans .env : ça remplace --url ci-dessous sans
  # toucher ce fichier. Laissé vide, le quick tunnel reste le comportement par défaut.
  cloudflared-dashboard:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate ${CLOUDFLARE_TUNNEL_ARGS:---url http://dashboard:80}
    depends_on:
      - dashboard
    mem_limit: 128m
    logging: *default-logging

volumes:
  mise_db_data:
  mise_api_storage:
  mise_db_backups:
  mise_mosquitto_data:
