# Déploiement de référence du projet — hébergement local (mini PC en cuisine ou tout poste avec
# Docker) + accès extérieur via tunnel Cloudflare (cloudflared-dashboard/cloudflared-public plus
# bas), voir DEPLOY.md pour la procédure complète. Limites mémoire et rotation des logs sur
# chaque service, pour qu'un conteneur qui dérape ne mette pas à genoux le reste ni ne remplisse
# le disque au fil des mois — pensées pour un mini PC, pas pour un gros serveur.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mise_db_data:/var/lib/mysql
    ports:
      # Publié pour que du code lancé nativement sur l'hôte (hors Docker, ex. artisan/tests)
      # puisse se connecter à la même base que le conteneur api (DB_HOST=127.0.0.1 dans .env),
      # avec les mêmes identifiants — plus besoin d'un MySQL local séparé.
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g
    logging: *default-logging

  # Sauvegarde automatique de la base (mysqldump quotidien, compressé, rotation sur les 14
  # derniers jours) — voir mise_db_backups ci-dessous pour où ils atterrissent.
  db-backup:
    image: fradelg/mysql-cron-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_USER: root
      MYSQL_PASS: ${DB_ROOT_PASSWORD}
      MYSQL_DB: ${DB_DATABASE}
      MAX_BACKUPS: 14
      INIT_BACKUP: 1
      CRON_TIME: "0 3 * * *"
    volumes:
      - mise_db_backups:/backup
    mem_limit: 128m
    logging: *default-logging

  api:
    build: ./mise-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Seule différence réelle entre le conteneur et une exécution native : le nom d'hôte de
      # la base (réseau interne du compose vs 127.0.0.1). Tout le reste vient de .env, partagé
      # avec une exécution native de mise-api (voir mise-api/bootstrap/app.php).
      DB_HOST: db
    volumes:
      - mise_api_storage:/var/www/html/storage/app/public
    ports:
      - "8000:80"
    mem_limit: 512m
    logging: *default-logging

  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8083:8080"
    mem_limit: 128m
    logging: *default-logging

  dashboard:
    build: ./mise-dashboard
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8081:80"
    mem_limit: 128m
    logging: *default-logging

  public:
    build: ./mise-public
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8082:80"
    mem_limit: 128m
    logging: *default-logging

  # Tunnels Cloudflare "quick tunnel" : aucun compte/domaine Cloudflare requis, juste une URL
  # https://xxxx.trycloudflare.com générée à chaque démarrage (voir les logs du conteneur pour la
  # récupérer — elle change à chaque redémarrage, c'est la limite de ce mode). Accès extérieur
  # sans toucher au réseau local ni au routeur. Pas de port à publier : cloudflared rejoint le
  # réseau compose et atteint directement dashboard:80 / public:80 par leur nom de service.
  cloudflared-dashboard:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://dashboard:80
    depends_on:
      - dashboard
    mem_limit: 128m
    logging: *default-logging

  cloudflared-public:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://public:80
    depends_on:
      - public
    mem_limit: 128m
    logging: *default-logging

volumes:
  mise_db_data:
  mise_api_storage:
  mise_db_backups:
