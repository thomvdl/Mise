services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mise_db_data:/var/lib/mysql
    ports:
      # Publié pour que du code lancé nativement sur l'hôte (hors Docker, ex. artisan/tests)
      # puisse se connecter à la même base que le conteneur api (DB_HOST=127.0.0.1 dans .env),
      # avec les mêmes identifiants — plus besoin d'un MySQL local séparé.
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./mise-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Seule différence réelle entre le conteneur et une exécution native : le nom d'hôte de
      # la base (réseau interne du compose vs 127.0.0.1). Tout le reste vient de .env, partagé
      # avec une exécution native de mise-api (voir mise-api/bootstrap/app.php).
      DB_HOST: db
    volumes:
      - mise_api_storage:/var/www/html/storage/app/public
    ports:
      - "8000:80"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "8083:80"

  dashboard:
    build: ./mise-dashboard
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8081:80"

  public:
    build: ./mise-public
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8082:80"

volumes:
  mise_db_data:
  mise_api_storage:
