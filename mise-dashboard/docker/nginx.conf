server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin relative /api calls (environment.apiUrl = '/api') — proxied to the API
    # container so no CORS config is ever needed, on the dev proxy.conf.json's model.
    location /api/ {
        proxy_pass http://api:80/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html doit toujours être revalidé — c'est lui qui référence les noms de fichiers
    # hashés (main-XXXX.js, chunk-XXXX.js) du build courant. Sans ça, le navigateur peut le
    # garder en cache après un nouveau déploiement et continuer à demander d'anciens chunks qui
    # n'existent plus (404 silencieux) : la navigation vers les routes concernées ne fait plus
    # rien, jusqu'à un rechargement forcé.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fichiers de build (JS/CSS) — noms hashés par contenu, jamais réutilisés d'un build à
    # l'autre : cache long et agressif sans risque de servir une version périmée.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routed Angular app — unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
