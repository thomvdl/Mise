<div class="page-header">
  <h1 class="page-title">Menus</h1>
  <div class="page-actions">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" placeholder="Rechercher…" [value]="search()" (input)="search.set($any($event.target).value)">
    </div>
    <button type="button" class="btn btn-ghost" [disabled]="selected().size === 0" (click)="exportSelection()">
      Exporter la sélection{{ selected().size ? ' (' + selected().size + ')' : '' }}
    </button>
    <a class="btn btn-primary" routerLink="import">Importer</a>
    <a class="btn btn-primary" routerLink="nouveau">+ Nouveau</a>
  </div>
</div>

<div class="table-wrap">
  <table class="data-table">
    <thead>
      <tr>
        <th class="col-check">
          <input type="checkbox" [checked]="allSelected()" (change)="toggleSelectAll()" aria-label="Tout sélectionner" />
        </th>
        <th>Nom</th>
        <th>Dates</th>
        <th>Sections</th>
        <th>Plats</th>
        <th class="col-actions"></th>
      </tr>
    </thead>
    <tbody>
      @for (item of filtered(); track item.id) {
        <tr>
          <td class="col-check">
            <input type="checkbox" [checked]="isSelected(item.id)" (change)="toggleSelected(item.id)" [attr.aria-label]="'Sélectionner ' + item.name" />
          </td>
          <td>{{ item.name }}</td>
          <td>{{ dateLabel(item) }}</td>
          <td>{{ sectionCount(item) }}</td>
          <td>{{ platCount(item) }}</td>
          <td class="col-actions">
            <button type="button" class="btn btn-ghost btn-sm" (click)="exportOne(item)">Exporter</button>
            <a class="btn btn-ghost btn-sm" [routerLink]="[item.id, 'imprimer']">Imprimer</a>
            <a class="btn btn-ghost btn-sm" [routerLink]="[item.id, 'liste-courses']">Liste de courses</a>
            <a class="btn btn-ghost btn-sm" [routerLink]="[item.id]">Modifier</a>
            <button type="button" class="btn btn-danger btn-sm" (click)="confirmDelete(item)">Supprimer</button>
          </td>
        </tr>
      } @empty {
        <tr class="empty-row">
          <td colspan="6">Aucun menu.</td>
        </tr>
      }
    </tbody>
  </table>
</div>

<app-confirm-dialog
  [open]="pendingDelete() !== null"
  [message]="deleteMessage()"
  (confirm)="deleteConfirmed()"
  (cancel)="cancelDelete()">
</app-confirm-dialog>
