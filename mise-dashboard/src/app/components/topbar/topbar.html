<header class="topbar">
  <button
    type="button"
    class="menu-toggle"
    [class.open]="menuOpen()"
    [attr.aria-expanded]="menuOpen()"
    aria-label="Ouvrir/fermer le menu"
    (click)="toggleMenu()">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <a class="brand" routerLink="/">MISE<span>.</span></a>

  <nav class="nav-links" [class.open]="menuOpen()">
    <a
      class="nav-link"
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeMenu()">
      Accueil
    </a>
    @for (link of navLinks; track link.path) {
      <a class="nav-link" [routerLink]="link.path" routerLinkActive="active" (click)="closeMenu()">
        {{ link.label }}
      </a>
    }
    <a class="nav-link nav-link-settings" [routerLink]="settingsLink.path" routerLinkActive="active" (click)="closeMenu()">
      {{ settingsLink.label }}
    </a>
  </nav>

  <button class="theme-toggle" id="themeToggle" aria-label="Changer de thème" (click)="toggle()">
    <span class="knob">
      <svg id="knobIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </span>
  </button>

  @if (currentUser(); as user) {
    <div class="user-badge">
      <span class="user-name">{{ user.name }}</span>
      <button type="button" class="btn btn-ghost btn-sm" (click)="logout()">Déconnexion</button>
    </div>
  }
</header>
@if (menuOpen()) {
  <div class="menu-backdrop" (click)="closeMenu()"></div>
}
