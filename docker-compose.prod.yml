# Configuration Docker Compose de PRODUCTION — voir DEPLOY.md pour la procédure complète.
#
# Différences principales avec docker-compose.yml (dev) :
#   - Reverse proxy Caddy en frontal, HTTPS automatique (Let's Encrypt). Ce n'est pas un
#     confort : l'impression Brother QL (WebUSB) et le mode hors-ligne de mise-public (PWA,
#     service worker) ne fonctionnent qu'en contexte sécurisé (HTTPS ou localhost), jamais en
#     HTTP simple une fois le projet sorti de la machine locale.
#   - Aucun port ne fuit directement vers l'extérieur à part 80/443 (Caddy) : MySQL et les apps
#     elles-mêmes ne sont plus publiés sur l'hôte, uniquement joignables via le réseau interne
#     du compose. Adminer n'est même plus démarré par défaut (voir DEPLOY.md pour un dépannage
#     ponctuel via tunnel SSH).
#   - Limites mémoire et rotation des logs, pour qu'un service qui dérape ne mette pas à genoux
#     tout le VPS ni ne remplisse le disque au fil des mois. Valeurs pensées pour un petit VPS
#     (2-4 Go de RAM) — à ajuster selon le vôtre.
#
# Usage : docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mise_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    build: ./mise-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Seule vraie différence entre le conteneur et une exécution native : le nom d'hôte de la
      # base (réseau interne du compose). Tout le reste vient de .env.
      DB_HOST: db
    volumes:
      - mise_api_storage:/var/www/html/storage/app/public
    healthcheck:
      # Pas de curl/wget dans l'image php:8.4-apache par défaut — on vérifie via PHP lui-même
      # plutôt que d'ajouter un paquet juste pour ça.
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  dashboard:
    build: ./mise-dashboard
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  public:
    build: ./mise-public
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Reverse proxy + HTTPS automatique (Let's Encrypt). Seul service exposé sur l'hôte.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - dashboard
      - public
      - api
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  mise_db_data:
  mise_api_storage:
  caddy_data:
  caddy_config:
