# Broker MQTT local pour les capteurs de température Zigbee — voir §10 de DEPLOY.md.
# Pas d'authentification : réseau local de confiance uniquement (même niveau de confiance que le
# port MySQL publié dans docker-compose.yml), jamais exposé sur internet.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
